---
### Bundle

name    : multio-develop-bundle
version : 0.3.0
cmake   : >
    ECBUILD_INSTALL_LIBRARY_HEADERS=OFF
    ECBUILD_INSTALL_FORTRAN_MODULES=OFF
    CMAKE_LINK_DEPENDS_NO_SHARED=ON

projects :

    - ecbuild :
        git     : git@github.com:ecmwf/ecbuild
        version : develop
        bundle  : false

    - eckit :
        git     : git@github.com:ecmwf/eckit
        version : develop
        cmake   : >
            ENABLE_VIENNACL=OFF
            ENABLE_EIGEN=OFF
            ENABLE_ARMADILLO=OFF
            ENABLE_CUDA=OFF
            ENABLE_SANDBOX=OFF
            ENABLE_MPI=ON

    - eccodes :
        git     : git@github.com:ecmwf/eccodes
        version : develop
        require : eckit
        cmake   : >
            ENABLE_ECCODES_THREADS=ON
            ENABLE_NETCDF=OFF
            ENABLE_FORTRAN=ON
            ENABLE_MEMFS=ON
            ECCODES_INSTALL_EXTRA_TOOLS=ON
            ECCODES_ENABLE_PYTHON2=OFF
            ECCODES_ENABLE_AEC=ON
            ENABLE_ECKIT_GEO=ON

    - fckit :
        git     : git@github.com:ecmwf/fckit
        version : develop
        require : eckit
        cmake   : FCKIT_ENABLE_FINAL=OFF

    - ecflow-light :
        git     : git@github.com:ecmwf/ecflow-light
        version : develop
        require : eckit

    - metkit :
        git     : git@github.com:ecmwf/metkit
        version : develop
        require : eckit

    - fdb5 :
        git     : git@github.com:ecmwf/fdb
        version : develop
        require : eckit metkit
        cmake   : >
            ENABLE_FDB_TOOLS=ON

    - atlas :
        git     : git@github.com:ecmwf/atlas
        version : develop
        require : eckit
        cmake   : ENABLE_TESSELATION=OFF ENABLE_TRANS=OFF ENABLE_CLANG_TIDY=OFF ENABLE_GRIDTOOLS_STORAGE=OFF

    - mir :
        git     : git@github.com:ecmwf/mir
        version : develop
        require : atlas

    - multio :
        git     : git@github.com:ecmwf/multio
        version : develop
        cmake   : >
            ENABLE_MULTIO_SERVER=ON
            ENABLE_LEGACY_IFSIO=ON
            ENABLE_ECFLOW_LIGHT=ON

    - atlas-orca :
        git     : git@github.com:ecmwf/atlas-orca
        version : develop
        require : eckit
