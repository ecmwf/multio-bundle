---
### Bundle

name    : multio-grib2grib-bundle-20260901
version : 0.4.0
cmake   : >
    ECBUILD_INSTALL_LIBRARY_HEADERS=OFF
    ECBUILD_INSTALL_FORTRAN_MODULES=OFF
    CMAKE_LINK_DEPENDS_NO_SHARED=ON

projects :

    - ecbuild :
        git     : git@github.com:ecmwf/ecbuild
        version : 3.15.2
        bundle  : false

    - eckit :
        git     : git@github.com:ecmwf/eckit
        version : 2.2.0
        cmake   : >
            ENABLE_VIENNACL=OFF
            ENABLE_EIGEN=OFF
            ENABLE_ARMADILLO=OFF
            ENABLE_CUDA=OFF
            ENABLE_SANDBOX=OFF
            ENABLE_MPI=ON
            ENABLE_ECKIT_GEO=ON

    - eccodes :
        git     : git@github.com:ecmwf/eccodes
        version : 2.48.1
        cmake   : >
            ENABLE_ECCODES_THREADS=ON
            ENABLE_NETCDF=OFF
            ENABLE_FORTRAN=ON
            ENABLE_MEMFS=ON
            ECCODES_INSTALL_EXTRA_TOOLS=ON
            ECCODES_ENABLE_PYTHON2=OFF
            ECCODES_ENABLE_AEC=ON

    - fckit :
        git     : git@github.com:ecmwf/fckit
        version : 0.14.4
        require : eckit
        cmake   : FCKIT_ENABLE_FINAL=OFF

    - metkit :
        git     : git@github.com:ecmwf/metkit
        version : 1.20.0
        require : eckit

    - fdb5 :
        git     : git@github.com:ecmwf/fdb
        version : 5.23.0
        require : eckit metkit
        cmake   : >
            ENABLE_FDB_TOOLS=ON

    - atlas :
        git     : git@github.com:ecmwf/atlas
        version : 0.46.0
        require : eckit
        cmake   : ENABLE_TESSELATION=OFF ENABLE_TRANS=OFF ENABLE_CLANG_TIDY=OFF ENABLE_GRIDTOOLS_STORAGE=OFF

    - multio :
        git     : git@github.com:ecmwf/multio
        version : 2.11.2
        cmake   : >
            ENABLE_MULTIO_SERVER=ON
            ENABLE_LEGACY_IFSIO=ON

